# Daily reward maintenance windows.
# Times use daily.timezone from config.yml so claim dates and maintenance dates agree.
# The timezone below is retained for operator reference; a mismatch logs a warning.
# A window is active from start (inclusive) to end (exclusive).
# Keep completed windows in this file so their dates remain valid streak-exemption history.
# Add a new named section under `windows` for future maintenance periods.

timezone: "America/Indiana/Indianapolis"

windows:
  chapter-2:
    enabled: true
    start: "2026-09-28T07:00:00"
    end: "2026-10-01T17:00:00"
    preserve-streaks: true
