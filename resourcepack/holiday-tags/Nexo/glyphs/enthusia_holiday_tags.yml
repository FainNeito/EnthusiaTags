# Icons used inside holiday reward tag text (HolidayTagCatalog). Not chat emojis: no placeholder or permission.
# The char is written straight into the tag text, so it must stay U+A0A0 (ꂠ). It lives in minecraft:default
# (not Nexo's own font) so it draws everywhere the tag text goes, including TAB and legacy-formatted chat.
pumpkin_king_icon:
  texture: enthusia:font/tags/pumpkin.png
  font: minecraft:default
  height: 9
  ascent: 8
  char: ꂠ
# The peppermint: Mint Condition's icon and the peppermint find icon (EnthusiaHolidays christmas/find, same entry).
# U+A0A1 is the Pumpkin Patcher seeds (pumpkin_patcher.yml), so this is U+A0A2.
peppermint_find_icon:
  texture: enthusia:font/tags/peppermint.png
  font: minecraft:default
  height: 9
  ascent: 8
  char: ꂢ
# The crowned peppermint: Peppermint Royalty, the Christmas hunt's first finishers.
peppermint_royalty_icon:
  texture: enthusia:font/tags/peppermint_royalty.png
  font: minecraft:default
  height: 9
  ascent: 8
  char: ꂣ
